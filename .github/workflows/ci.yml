name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rcs ripgrep

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install rcs ripgrep

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "gofmt needed on:"
            echo "$bad"
            exit 1
          fi

      - name: Test
        run: go test -gcflags=all=-l -count=1 ./...

      - name: Coverage
        run: |
          go test -gcflags=all=-l -coverprofile=cover.out ./...
          go tool cover -func=cover.out | grep total:
