# TibbitWiki configuration

# These settings require a server restart:
wiki_path: ~/TibbitWiki
listen: 127.0.0.1:8080
editor_cmd: ""
poll_interval: 3s
cache_size: 200
max_diffs: 10
# Suffixes to hide from the note attachment listing.
# Empty = show all files.  Example: [".pdf.md", ".bak"]
attachment_exclude: []
# Command to enqueue unconverted PDFs (empty = disabled).
# Template: %s = PDF path, %n = wiki name, %d = wiki note dir.
# Example: "pdf2md-enqueue %s %d/.pdf-queue"
pdf_convert_cmd: ""

# Note body templates — expanded before markdown rendering.
# Use Go text/template syntax: {{name "arg"}} or {{name "arg" | transform}}.
# Each template is a function that takes a string and returns HTML.
# Pipelines compose: {{img "pic.png" | half | center}}.
templates:
  # Content producers
  img:    '<img src="{{.}}" style="max-width:100%">'
  pdf:    '<object data="{{.}}" type="application/pdf" width="100%" height="600px"></object>'
  # Sizing — landscape-first (wider than tall)
  check:  '<div style="width:576px;height:264px;overflow:hidden">{{.}}</div>'
  postit: '<div style="width:288px;height:288px;overflow:hidden">{{.}}</div>'
  card:   '<div style="width:480px;height:288px;overflow:hidden">{{.}}</div>'
  photo:  '<div style="width:576px;height:384px;overflow:hidden">{{.}}</div>'
  a6:     '<div style="width:397px;height:280px;overflow:hidden">{{.}}</div>'
  a5:     '<div style="width:559px;height:397px;overflow:hidden">{{.}}</div>'
  half:   '<div style="width:816px;height:528px;overflow:hidden">{{.}}</div>'
  # Portrait
  letter: '<div style="width:816px;height:1056px;overflow:hidden">{{.}}</div>'
  legal:  '<div style="width:816px;height:1344px;overflow:hidden">{{.}}</div>'
  # Alignment
  center: '<div style="text-align:center">{{.}}</div>'
  right:  '<div style="float:right;margin:0 0 8px 16px">{{.}}</div>'
  left:   '<div style="float:left;margin:0 16px 8px 0">{{.}}</div>'

# Theme applies live on save.
# "shared" is the base for all wikis.  Add a section named after
# any wiki subdirectory to override specific values for that wiki.
theme:
  shared:
    # Colors
    bg:           "#1a1a2e"       # Page background
    fg:           "#e0e0e0"       # Body text
    title_fg:     "#e0e0e0"       # Note titles and page heading
    note_bg:      "#16213e"       # Note card background
    code_bg:      "#0d1117"       # Code/input backgrounds
    accent:       "#6cacee"       # WikiWord links, active tabs
    accent_hover: "#8ecaff"       # Hovered WikiWord links
    link:         "#6cacee"       # External URL links in note body
    link_hover:   "#8ecaff"       # Hovered external URL links
    danger:       "#e06060"       # Missing links, errors
    button_bg:    "#2a2a4a"       # Button hover background
    border:       "#333"          # Note outlines, dividers
    border_light: "#444"          # Input borders, underlines
    muted:        "#666"          # Dim text, inactive tabs
    muted_light:  "#aaa"          # Toolbar icons, search snippets
    blockquote:   "#888"          # Blockquote text
    # Typography
    font_family:  "system-ui, -apple-system, BlinkMacSystemFont, sans-serif"  # Body font stack
    font_size:    "16px"          # Base text size
    code_font:    "SF Mono, Cascadia Code, Consolas, Liberation Mono, monospace"  # Monospace font
    code_tab_size: "4"            # Tab width in code blocks
    line_height:  "1.6"           # Body line spacing
    # Layout
    note_radius:    "6px"         # Card corner radius
    sidebar_width:  "220px"       # Sidebar width
    sidebar_limit:  "20"          # Notes before ellipsis
    tag_limit:      "5"           # Tags per note
    # Identity
    wiki_title:     "TibbitWiki"  # Displayed in header and browser tab
    auto_open:      ""            # Note to display on page load
    # Keyboard shortcuts (set to "" to disable)
    key_search:     "/"           # Open search bar
    key_close:      "q"           # Close topmost note
    key_edit:       "e"           # External editor on topmost note
    key_textarea:   "E"           # In-browser edit on topmost note (shift)
    key_new:        "a"           # Create new note
    key_next:       "Tab"         # Jump to next note card
    key_prev:       "Shift-Tab"   # Jump to previous note card
    key_tag:        "#"           # Add tag to topmost note
  # Per-wiki overrides: section name matches the subdirectory name.
  demo:
    auto_open:      "TibbitWiki"  # Open welcome note on first visit
