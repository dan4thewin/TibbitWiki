<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>go-tiddle</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; }
h1 { margin-top: 0; }
.tiddler { border: 1px solid #ccc; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
.tiddler-header { display: flex; align-items: center; justify-content: space-between; }
.tiddler-header h2 { margin: 0; }
.tiddler-toolbar { display: flex; gap: 4px; }
.tiddler-toolbar button { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 2px 8px; font-size: 16px; }
.tiddler-toolbar button:hover { background: #eee; }
a.wikiword { color: #07c; text-decoration: none; }
a.wikiword:hover { text-decoration: underline; }
a.wikiword.missing { color: #c44; font-style: italic; }
</style>
</head>
<body>
<h1>go-tiddle</h1>
<div id="river"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
const CAMEL = /\b([A-Z][a-z]+(?:[A-Z][a-z0-9]*)+)\b/g;
let knownTitles = new Set();
let knownRevisions = {};

function linkifyWikiWords(html) {
  const parts = html.split(/(<a[^>]*>.*?<\/a>|<[^>]+>)/gs);
  return parts.map(part => {
    if (part.startsWith('<')) return part;
    return part.replace(CAMEL, (match) => {
      const cls = knownTitles.has(match) ? 'wikiword' : 'wikiword missing';
      return `<a href="#" class="${cls}" data-title="${match}">${match}</a>`;
    });
  }).join('');
}

function renderTiddler(t) {
  const card = document.createElement('div');
  card.className = 'tiddler';
  card.dataset.title = t.title;
  card.dataset.revision = t.revision || '0';

  const header = document.createElement('div');
  header.className = 'tiddler-header';
  const h2 = document.createElement('h2');
  h2.textContent = t.title;
  header.appendChild(h2);

  const toolbar = document.createElement('div');
  toolbar.className = 'tiddler-toolbar';

  // Edit-external button
  const editBtn = document.createElement('button');
  editBtn.textContent = 'edit';
  editBtn.title = 'Edit in Neovim';
  editBtn.onclick = () => {
    fetch('/edit-external/' + encodeURIComponent(t.title), {
      method: 'POST',
      headers: { 'X-Requested-With': 'TiddlyWiki' }
    });
  };
  toolbar.appendChild(editBtn);

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.title = 'Close';
  closeBtn.onclick = () => card.remove();
  toolbar.appendChild(closeBtn);

  header.appendChild(toolbar);
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'tiddler-body';
  body.innerHTML = linkifyWikiWords(marked.parse(t.text || ''));
  card.appendChild(body);
  return card;
}

function openTiddler(title) {
  const existing = document.querySelector(`.tiddler[data-title="${CSS.escape(title)}"]`);
  if (existing) { existing.scrollIntoView({ behavior: 'smooth' }); return; }
  fetch('/recipes/default/tiddlers/' + encodeURIComponent(title))
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(t => {
      knownRevisions[t.title] = t.revision;
      document.getElementById('river').prepend(renderTiddler(t));
    })
    .catch(() => alert('Tiddler not found: ' + title));
}

function refreshTiddler(title) {
  fetch('/recipes/default/tiddlers/' + encodeURIComponent(title))
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(t => {
      knownRevisions[t.title] = t.revision;
      const existing = document.querySelector(`.tiddler[data-title="${CSS.escape(title)}"]`);
      if (existing) {
        const body = existing.querySelector('.tiddler-body');
        body.innerHTML = linkifyWikiWords(marked.parse(t.text || ''));
        existing.dataset.revision = t.revision;
      }
    });
}

function poll() {
  fetch('/recipes/default/tiddlers.json')
    .then(r => r.json())
    .then(tiddlers => {
      knownTitles = new Set(tiddlers.map(t => t.title));
      tiddlers.forEach(t => {
        const prev = knownRevisions[t.title];
        if (prev !== undefined && String(t.revision) !== String(prev)) {
          refreshTiddler(t.title);
        }
      });
    })
    .finally(() => setTimeout(poll, 3000));
}

fetch('/recipes/default/tiddlers.json')
  .then(r => r.json())
  .then(tiddlers => {
    tiddlers.forEach(t => {
      knownTitles.add(t.title);
      knownRevisions[t.title] = t.revision;
    });
    openTiddler('ToDo');
    setTimeout(poll, 3000);
  });

document.addEventListener('click', e => {
  const link = e.target.closest('a.wikiword');
  if (link) {
    e.preventDefault();
    openTiddler(link.dataset.title);
  }
});
</script>
</body>
</html>
